name: Sync static portfolio SEO

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-static-portfolio-seo
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate static SEO and tracking
        run: node scripts/sync-static-seo.mjs

      - name: Commit generated HTML
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No static SEO changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: sync static portfolio SEO"
          git push
