name: Atualizar SEO estático

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Gerar metadados estáticos
        run: node scripts/update-static-seo.mjs

      - name: Publicar alterações quando necessário
        run: |
          if git diff --quiet -- index.html; then
            echo "Nenhuma alteração de SEO."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: sync static portfolio SEO"
          git push
